# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  name: 'azureuser'

steps:
- task: Bash@3
  inputs:
    targetType: 'inline'
    script: 'git clone https://github.com/IntelliqDevops/maven.git'
    
- task: Bash@3
  inputs:
    targetType: 'inline'
    script: 'cd /home/azureuser/myagent/_work/3/s;mvn package'

- task: Bash@3
  inputs:
    targetType: 'inline'
    script: 
       cat > Dockerfile <<'EOF'
       FROM tomee
       COPY /home/azureuser/myagent/_work/3/s/webapp/target/webapp.war /usr/local/tomee/webapps/raju.war
       EOF